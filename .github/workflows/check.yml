name: Check sources and committed objects
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
        id: build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-objects
          path: objects/
      - name: Verify committed artifacts and complete file set
        run: |
          git diff --exit-code -- objects/
          test -z "$(git ls-files --others --exclude-standard objects/)"
